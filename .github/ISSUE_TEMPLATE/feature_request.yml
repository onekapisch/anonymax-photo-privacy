name: Suggest an idea
description: Something AnonyMax should find, cover or make easier.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, for example selling a car, posting family photos or sharing a screenshot.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where would you use it?
      multiple: true
      options: [Mac, iPhone, iPad]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached real photos or personal details.
          required: true
